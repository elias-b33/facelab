name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - name: Verify rating training protocol without downloading face data
        run: |
          python3 -m venv calibration/rating/.venv
          calibration/rating/.venv/bin/python -m pip install --disable-pip-version-check numpy==2.4.6 Pillow==12.2.0
          calibration/rating/.venv/bin/python -m unittest discover -s calibration/rating -p 'test_*.py' -v
      - run: corepack pnpm build:vercel
        env:
          VERCEL: "1"
