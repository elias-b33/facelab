name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - name: Check the offline rating trainer and photo extraction contract
        run: |
          python3 -m venv /tmp/facelab-rating-ci
          /tmp/facelab-rating-ci/bin/python -m pip install -r calibration/requirements-rating.txt Pillow==12.3.0
          /tmp/facelab-rating-ci/bin/python -m unittest discover -s calibration -p 'test_*.py'
      - run: corepack pnpm build:vercel
        env:
          VERCEL: "1"
